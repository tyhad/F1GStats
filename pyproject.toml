[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "f1gstats"
version = "0.1.0"
description = "Fetch F1 season data (schedule, standings, starting grid) into a local SQLite database"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastf1>=3.4",
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/tyhad/F1GStats"
Repository = "https://github.com/tyhad/F1GStats"
Issues = "https://github.com/tyhad/F1GStats/issues"

[project.scripts]
f1gstats = "fetch_f1_data:main"

[tool.setuptools]
py-modules = ["fetch_f1_data"]
